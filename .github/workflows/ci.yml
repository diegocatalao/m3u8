name: CI

on: [push, pull_request]

jobs:
  lint:
    name: linter using clang-format
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: install lint dependencies
        run: sudo apt update && sudo apt install -y build-essential cmake clang-format

      - name: check code formatting with clang-format
        run: |
          for folder in src samples tests; do
            while IFS= read -r file; do
              if ! clang-format --dry-run --Werror "$file" 2>&1; then
                diff --color -u "$file" <(clang-format "$file" 2>/dev/null) || true
                EXIT_CODE=1
              fi
            done < <(find $folder -name "*.c" -o -name "*.h" -o -name "*.cc" -o -name "*.hh")
          done

  tests:
    name: run tests using ctest
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: install ctests dependencies
        run: sudo apt update && sudo apt install -y build-essential cmake libgtest-dev libgmock-dev

      - name: build and install library for this distribution
        run: |
          cmake -S . -B build -DCMAKE_INSTALL_PREFIX=$HOME/.local -DCOMPILE_TESTS=ON 
          cmake --build build
          cmake --install build

      - name: run the gtests codebase
        run: cd build && ctest --extra-verbose --output-on-failure
