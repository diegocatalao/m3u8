name: ✨ Feature Request
description: Suggest a new feature or enhancement for the project
title: "[FEATURE]: "
labels: ["enhancement"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        ## Thanks for suggesting an improvement! 🚀

        Please provide as much detail as possible to help us understand your suggestion.

  - type: textarea
    id: problem
    attributes:
      label: Related Problem
      description: Is this feature request related to a problem? Please describe it
      placeholder: "Example: I'm always frustrated when..."
    validations:
      required: false

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like to see
      placeholder: What would you like to happen?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Have you thought about other solutions?
      placeholder: Describe any alternative solutions or features you've considered
    validations:
      required: false

  - type: textarea
    id: benefits
    attributes:
      label: Benefits
      description: How would this feature benefit the project and its users?
      placeholder: |
        - Improves performance
        - Enhances user experience
        - Simplifies workflow
    validations:
      required: false

  - type: textarea
    id: implementation
    attributes:
      label: Implementation Ideas
      description: Do you have ideas on how this could be implemented?
      placeholder: Technical details, API suggestions, code examples, etc.
    validations:
      required: false

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How important is this feature to you?
      options:
        - Low - Nice to have
        - Medium - Would improve workflow
        - High - Critical for my use case
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add any other context, screenshots, mockups, or examples
      placeholder: Provide links, images, or references that help illustrate your idea

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched for similar feature requests before creating this one
          required: true
        - label: I have read the documentation
          required: false
        - label: I am willing to help implement this feature
          required: false
